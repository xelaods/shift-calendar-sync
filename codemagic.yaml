workflows:
  ios-adhoc:
    name: iOS Ad-hoc (自分のデバイス用 IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # ── Node / Xcode / CocoaPods バージョン ────────────────────────
      node: 20.17.0
      xcode: latest
      cocoapods: default
      # ── コード署名の変数（Codemagic の Secrets に登録する） ─────────
      # Settings → Global variables and secrets に以下を登録してください:
      #   CM_CERTIFICATE          ... P12 を base64 エンコードした文字列
      #   CM_CERTIFICATE_PASSWORD ... P12 のパスワード（平文）
      #   CM_PROVISIONING_PROFILE ... .mobileprovision を base64 エンコードした文字列
      groups:
        - ios_credentials

    scripts:
      # 1. Node 依存関係インストール
      - name: npm install
        script: |
          cd ShiftSyncApp
          npm ci

      # 2. Expo prebuild で ios/ ネイティブプロジェクトを生成
      - name: Expo prebuild
        script: |
          cd ShiftSyncApp
          npx expo prebuild --platform ios --clean --non-interactive

      # 3. CocoaPods
      - name: pod install
        script: |
          cd ShiftSyncApp/ios
          pod install

      # 4. Keychain を初期化
      - name: Set up keychain
        script: keychain initialize

      # 5. P12 証明書を Keychain に登録
      - name: Set up signing certificate
        script: |
          echo "${CM_CERTIFICATE}" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "${CM_CERTIFICATE_PASSWORD}"

      # 6. Provisioning Profile を配置
      - name: Set up provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "${CM_PROVISIONING_PROFILE}" | base64 --decode \
            > "$PROFILES_HOME/adhoc.mobileprovision"

            # 7. ビルドと IPA エクスポート
      - name: Build and Export IPA
        script: |
          cd ShiftSyncApp/ios
          
          # プロファイル情報の抽出
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/adhoc.mobileprovision"
          PROFILE_UUID=$(grep -a -A 1 'UUID' "$PROFILE_PATH" | grep string | sed -e 's/<[^>]*>//g' | xargs)
          TEAM_ID=$(grep -a -A 2 'application-identifier' "$PROFILE_PATH" | grep string | sed -e 's/<[^>]*>//g' | xargs | cut -d'.' -f1)
          BUNDLE_ID=$(grep -a -A 2 'application-identifier' "$PROFILE_PATH" | grep string | sed -e 's/<[^>]*>//g' | xargs | cut -d'.' -f2-)
          
          if grep -a -A 1 'get-task-allow' "$PROFILE_PATH" | grep -q 'true'; then
            METHOD="development"
          else
            METHOD="ad-hoc"
          fi
          
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Export Method: $METHOD"
          
          # ExportOptions.plist の生成
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          
                    # ワークスペースとスキームの一覧を表示してデバッグ
          xcodebuild -list -workspace ShiftSync.xcworkspace
          
          # アーカイブ作成
          xcodebuild             -workspace ShiftSync.xcworkspace             -scheme ShiftSync             -configuration Release             -archivePath "$CM_BUILD_DIR/ShiftSync.xcarchive"             -destination "generic/platform=iOS"             CODE_SIGN_STYLE=Manual             DEVELOPMENT_TEAM="${TEAM_ID}"             PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}"             archive
          
          # IPA エクスポート
          xcodebuild             -exportArchive             -archivePath "$CM_BUILD_DIR/ShiftSync.xcarchive"             -exportOptionsPlist /tmp/ExportOptions.plist             -exportPath "$CM_BUILD_DIR/ipa"

    # ── 成果物 ─────────────────────────────────────────────────────────
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/ShiftSync.xcarchive
      - /tmp/xcodebuild_logs/*.log

    # ── ビルド完了通知 ─────────────────────────────────────────────────
    publishing:
      email:
        recipients:
          - xelaods@gmail.com
        notify:
          success: true
          failure: true
