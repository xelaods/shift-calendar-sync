workflows:
  unity-ios-workflow:
    name: Unity iOS Build Workflow
    max_build_duration: 90
    instance_type: mac_mini_m1
    environment:
      groups:
        - unity # 👈 あとでCodemagicに入力するメール・パスワードのグループ名
      vars:
        UNITY_PROJECT_PATH: "UnityApp/ShiftSync"
        UNITY_VERSION: "6000.0.23f1"
    scripts:
      - name: Activate Unity License
        script: |
          echo "🚀 Unityの認証を開始します..."
          # Codemagicの仕組みを使って、無料アカウントで安全にログインします
          unity-authenticator
      - name: Build Unity iOS Project
        script: |
          echo "🏗️ Unityビルド（iOSプロジェクト出力）を開始します..."
          $UNITY_HOME/Unity.app/Contents/MacOS/Unity \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$UNITY_PROJECT_PATH" \
            -buildTarget iOS \
            -executeMethod UnityEditor.BuildPlayerWindow.Build
      - name: Build .ipa with Xcode
        script: |
          echo "📦 Xcodeプロジェクトを .ipa ファイルに変換します..."
          # 署名なし（無料）で強制的に .ipa ファイルを組み立てるコマンドです
          xcode-project build-ipa \
            --workspace "build/iOS/iOS/Unity-iPhone.xcworkspace" \
            --scheme "Unity-iPhone"
    artifacts:
      - build/iOS/iOS/*.ipa
