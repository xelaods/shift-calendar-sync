name: Shift Calendar Sync

on:
  schedule:
    # 毎日 日本時間 7:00 (UTC 22:00 前日) に実行
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
      GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch shifts from Shifucon
        env:
          SHIFUCON_ID: ${{ secrets.SHIFUCON_ID }}
          SHIFUCON_PASS: ${{ secrets.SHIFUCON_PASS }}
        run: node fetch-shifucon.js

      - name: Commit updated shifts.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add shifts.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update shifts.json from Shifucon"
          git push

      - name: Sync shifts to Google Calendar
        run: node calendar-sync.js
