name: Shift Calendar Sync

on:
  schedule:
    # 毎日 日本時間 7:00 (UTC 22:00 前日) に実行
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        working-directory: shift_sync
        run: pip install -r requirements.txt

      - name: Write service_account.json from secret
        working-directory: shift_sync
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_B64 }}" | base64 -d > service_account.json

      - name: Run shift sync
        working-directory: shift_sync
        env:
          SHIFUCON_STAFF_ID: ${{ secrets.SHIFUCON_ID }}
          SHIFUCON_PASSWORD: ${{ secrets.SHIFUCON_PASS }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python main.py
