name: Shift Calendar Sync

on:
  schedule:
    # 毎日 日本時間 7:00 (UTC 22:00 前日) に実行
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Create credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Create token.json
        run: echo '${{ secrets.GOOGLE_TOKEN }}' > token.json

      - name: Sync shifts to Google Calendar
        run: node calendar-sync.js
