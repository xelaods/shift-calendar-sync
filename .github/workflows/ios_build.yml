name: iOS Build

on:
  workflow_dispatch:  # 手動実行
  push:
    branches: [master]
    paths:
      - 'UnityApp/ShiftSync/Assets/**'
      - 'UnityApp/ShiftSync/Packages/**'
      - 'UnityApp/ShiftSync/ProjectSettings/**'

jobs:
  build:
    name: Build for iOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ── チェックアウト ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Library キャッシュ（2回目以降を高速化） ─────────────────────
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityApp/ShiftSync/Library
          key: Library-iOS-${{ hashFiles('UnityApp/ShiftSync/Assets/**','UnityApp/ShiftSync/Packages/**','UnityApp/ShiftSync/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      # ── Unity ビルド（GameCI v4 / Personal ライセンス） ────────────
      #    Unity Personal は UNITY_EMAIL + UNITY_PASSWORD のみで動作
      #    UNITY_LICENSE（.ulf）は不要（新ライセンスシステム）
      # ── Unity ビルド（GameCI v4 / Personal ライセンス） ────────────
      # ── Unity ビルド（GameCI v4 / Personal ライセンス） ────────────
      - name: Run Unity Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: iOS
          projectPath: UnityApp/ShiftSync
          unityVersion: 6000.0.076f1  # 👈 【追加】あなたのUnityのバージョンを直接指定

      # ── Xcodeプロジェクト → .ipa（署名なし） ───────────────────────
      - name: Archive & export .ipa (no signing)
        run: |
          set -e
          BUILD_DIR="build/iOS/iOS"

          # xcodeproj が存在するか確認
          ls "$BUILD_DIR"

          xcodebuild \
            -project "$BUILD_DIR/Unity-iPhone.xcodeproj" \
            -scheme   Unity-iPhone \
            -sdk      iphoneos \
            -configuration Release \
            -archivePath "$BUILD_DIR/ShiftSync.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | tail -20

          # .xcarchive → Payload → .ipa
          APP_PATH="$BUILD_DIR/ShiftSync.xcarchive/Products/Applications/ShiftSync.app"
          IPA_DIR="$BUILD_DIR/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -qr ShiftSync.ipa Payload/
          echo "✅ IPA 生成完了: $IPA_DIR/ShiftSync.ipa"

      # ── アーティファクトとしてアップロード ──────────────────────────
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ShiftSync-iOS-${{ github.run_number }}
          path: build/iOS/iOS/ipa/ShiftSync.ipa
          retention-days: 14
          if-no-files-found: error
