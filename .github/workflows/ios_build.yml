name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'UnityApp/ShiftSync/Assets/**'
      - 'UnityApp/ShiftSync/Packages/**'
      - 'UnityApp/ShiftSync/ProjectSettings/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node.js 24 対応

jobs:
  build:
    name: Build for iOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityApp/ShiftSync/Library
          key: Library-iOS-${{ hashFiles('UnityApp/ShiftSync/Assets/**','UnityApp/ShiftSync/Packages/**','UnityApp/ShiftSync/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      # UNITY_LICENSE = C:\ProgramData\Unity\Unity_lic.ulf の内容
      - name: Build Unity → iOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          projectPath: UnityApp/ShiftSync
          unityVersion: 6000.0.23f1
          unityLicensingServer: Personal

      - name: Archive & export .ipa (no signing)
        run: |
          set -e
          BUILD_DIR="build/iOS/iOS"
          ls "$BUILD_DIR"

          xcodebuild \
            -project "$BUILD_DIR/Unity-iPhone.xcodeproj" \
            -scheme   Unity-iPhone \
            -sdk      iphoneos \
            -configuration Release \
            -archivePath "$BUILD_DIR/ShiftSync.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | tail -20

          APP_PATH="$BUILD_DIR/ShiftSync.xcarchive/Products/Applications/ShiftSync.app"
          IPA_DIR="$BUILD_DIR/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -qr ShiftSync.ipa Payload/
          echo "✅ IPA 生成完了"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ShiftSync-iOS-${{ github.run_number }}
          path: build/iOS/iOS/ipa/ShiftSync.ipa
          retention-days: 14
          if-no-files-found: error
