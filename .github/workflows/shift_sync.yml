name: Auto Shift Sync to Google Calendar

on:
  # 毎日日本時間 午前7時 (UTC 22:00) に自動実行
  schedule:
    - cron: '0 22 * * *'
  # GitHub上の画面から手動実行も可能にする
  workflow_dispatch:

jobs:
  sync-shift:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: 接続診断 (IP・ヘッダー・TLS検証)
        run: |
          echo "=== 1. Actions RunnerのIPアドレス確認 ==="
          curl -s https://ifconfig.me
          echo ""

          echo "=== 2. 通常のcurlリクエスト ==="
          curl -I -s https://shifucon.ppihgroup.com/staffpage/ || true

          echo "=== 3. 完全なブラウザ偽装ヘッダー付きcurl ==="
          curl -I -s -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" -H "Accept-Language: ja,en-US;q=0.9,en;q=0.8" https://shifucon.ppihgroup.com/staffpage/ || true

          echo "=== 4. curl_cffi (Chrome TLSフィンガープリント) によるテスト ==="
          python -c "
          from curl_cffi import requests
          try:
              r = requests.get('https://shifucon.ppihgroup.com/staffpage/', impersonate='chrome120', timeout=10)
              print(f'curl_cffi Status: {r.status_code}')
          except Exception as e:
              print(f'curl_cffi Error: {e}')
          " || true

      - name: シフト同期スクリプトの実行
        env:
          LOGIN_ID: ${{ secrets.SHIFT_LOGIN_ID }}
          PASSWORD: ${{ secrets.SHIFT_PASSWORD }}
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          SYNC_DAYS: 5
        run: |
          python sync_shift.py
