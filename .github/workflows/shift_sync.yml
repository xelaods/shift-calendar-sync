name: Auto Shift Sync to Google Calendar

on:
  # 自動実行は無効化
  # GitHub上の画面から手動実行のみ可能
  workflow_dispatch:

jobs:
  sync-shift:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 requests

      - name: シフト同期スクリプトの実行 (Selenium Headless Chrome)
        env:
          LOGIN_ID: ${{ secrets.SHIFT_LOGIN_ID }}
          PASSWORD: ${{ secrets.SHIFT_PASSWORD }}
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          SYNC_DAYS: 7
        run: |
          python sync_shift.py
